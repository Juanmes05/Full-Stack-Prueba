spring.application.name=alquiler-vehiculos
server.port=8080

# Por defecto usa H2 en memoria, así "java -jar" arranca sin nada más instalado.
# En Docker, las variables SPRING_DATASOURCE_* de docker-compose.yml apuntan a MySQL.
spring.datasource.url=jdbc:h2:mem:alquileres;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Los DTO se construyen dentro de la transacción del servicio o con @EntityGraph
spring.jpa.open-in-view=false
