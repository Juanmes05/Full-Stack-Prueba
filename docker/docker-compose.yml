# Despliegue completo en localhost:
#   frontend -> http://localhost:8081
#   backend  -> http://localhost:8080
#   MySQL    -> localhost:3306
# Uso (desde esta carpeta): docker compose up --build
services:
  db:
    image: mysql:8.4.0
    environment:
      MYSQL_DATABASE: cldb
      MYSQL_USER: cliente
      MYSQL_PASSWORD: clpd
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    ports:
      - "3306:3306"
    volumes:
      - datos:/var/lib/mysql
    restart: always
    healthcheck:
      # Por TCP (127.0.0.1): el servidor temporal de la primera inicialización solo escucha por socket
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "cliente", "-pclpd"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/cldb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: cliente
      SPRING_DATASOURCE_PASSWORD: clpd
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: always

volumes:
  datos:
